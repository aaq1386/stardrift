name: Build STARDRIFT for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pygame>=2.5.0,<3.0.0" pyinstaller appdirs

      - name: Build Windows executable
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/music/OutThere.ogg")) {
            throw "Required music asset not found: assets/music/OutThere.ogg"
          }
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name STARDRIFT `
            --distpath "release/windows/dist" `
            --workpath "release/windows/build" `
            --specpath "release/windows" `
            --add-data "assets/music;assets/music" `
            --collect-all appdirs `
            --hidden-import appdirs `
            main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: STARDRIFT-Windows-x64
          path: release/windows/dist/STARDRIFT.exe
          if-no-files-found: error
          retention-days: 14
